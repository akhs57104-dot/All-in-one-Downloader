# Render blueprint: connect this repo and Render builds it automatically.
# Docs: https://render.com/docs/blueprint-spec
# Docker runtime (not the plain Python runtime) so ffmpeg is bundled and
# yt-dlp can merge separate video and audio tracks.
services:
  - type: web
    name: tech-arslan-software-solutions
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: TERABOX_FALLBACK
        value: "on"
