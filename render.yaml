# Render blueprint: connect this repo and Render builds it automatically.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tech-arslan-software-solutions
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 300 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: TERABOX_FALLBACK
        value: "on"
