pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "TechArslanDownloader"
include ':app'

def localProps = new File(rootDir, "local.properties")
if (!localProps.exists()) {
    def sdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    if (sdkDir) {
        localProps.text = "sdk.dir=${sdkDir}\n"
    }
}
